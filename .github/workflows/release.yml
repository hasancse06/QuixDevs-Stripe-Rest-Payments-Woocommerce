name: Prepare Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag containing this workflow (must match 1.0.0)
        required: true
        type: string
        default: v1.0.0
  push:
    tags:
      - 'v*'

# Tests/builds use read-only tokens; only the final unpublished-draft job can write releases.
permissions:
  contents: read

concurrency:
  group: stripe-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate existing tag, clean checkout and unchanged version
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 tools/prepare-release.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

  quality:
    needs: identity
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.identity.outputs.commit }}
    permissions:
      contents: read

  package:
    needs: [identity, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Recheck source/tag identity
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: python3 tools/prepare-release.py --tag "$RELEASE_TAG"
      - name: Install checksum-pinned official Gitleaks
        run: python3 tools/install-gitleaks.py --destination "$RUNNER_TEMP/quixdevs-release-tools"
      - name: Scan maintained source for secrets
        run: '"$RUNNER_TEMP/quixdevs-release-tools/gitleaks" dir . --config .gitleaks.toml --ignore-gitleaks-allow --redact --no-banner'
      - name: Build and verify the development-only runtime package
        run: |
          python3 tools/check-source.py
          python3 tools/package.py
          python3 tools/verify-package.py
          python3 tools/check-repository.py
          unzip -t dist/quixdevs-stripe-rest-payments.zip
          (cd dist && sha256sum --check quixdevs-stripe-rest-payments.zip.sha256)
      - name: Scan every extracted runtime file for secrets
        run: |
          runtime_dir=$(mktemp -d "$RUNNER_TEMP/quixdevs-runtime.XXXXXX")
          python3 -m zipfile -e dist/quixdevs-stripe-rest-payments.zip "$runtime_dir"
          "$RUNNER_TEMP/quixdevs-release-tools/gitleaks" dir "$runtime_dir" --config .gitleaks.toml --ignore-gitleaks-allow --redact --no-banner
      - name: Prepare notes for the verified package
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 tools/create-draft-release.py --prepare-notes --repo "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG" --expected-commit "$RELEASE_COMMIT"
      - name: Pass only verified distribution artifacts to the draft job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stripe-release-${{ needs.identity.outputs.tag }}
          path: |
            dist/quixdevs-stripe-rest-payments.zip
            dist/quixdevs-stripe-rest-payments.zip.sha256
            dist/package-manifest.json
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  draft:
    needs: [identity, quality, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: stripe-release-${{ needs.identity.outputs.tag }}
          path: dist
      - name: Revalidate source/tag identity and downloaded artifacts
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          python3 tools/prepare-release.py --tag "$RELEASE_TAG"
          python3 tools/verify-package.py
      - name: Create or resume an unpublished draft only; never overwrite published assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 tools/create-draft-release.py --repo "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG" --expected-commit "$RELEASE_COMMIT"
