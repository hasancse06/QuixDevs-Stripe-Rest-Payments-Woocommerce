name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Reviewed source commit for distribution checks
        required: true
        type: string
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: find includes -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -l quixdevs-stripe-rest-payments.php && php -l uninstall.php
      - run: composer lint
      - run: composer analyse
      - run: composer test
      - run: python3 -m unittest discover -s tests/Packaging -v
      - run: composer package
      - run: python3 tools/verify-package.py
      - run: python3 tools/check-source.py
      - run: python3 tools/check-repository.py
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable
          MYSQL_DATABASE: quixdevs_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -pdisposable"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      QUIXDEVS_WP_ROOT: /tmp/quixdevs-wordpress
      QUIXDEVS_DB_HOST: quixdevs-db:3306
      QUIXDEVS_DB_USER: root
      QUIXDEVS_DB_PASSWORD: disposable
      QUIXDEVS_DISPOSABLE_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          tools: composer:v2, wp-cli
          extensions: mysqli
          coverage: none
      - run: echo '127.0.0.1 quixdevs-db' | sudo tee -a /etc/hosts
      - run: composer install --no-interaction --prefer-dist
      - run: bash tools/provision-test-site.sh
      - run: composer test:integration
      - run: composer package
      - run: python3 tools/verify-package.py
      - run: wp plugin activate plugin-check --path="$QUIXDEVS_WP_ROOT"
      - name: Install the ZIP instead of the source symlink
        run: |
          wp plugin deactivate quixdevs-stripe-rest-payments --path="$QUIXDEVS_WP_ROOT"
          test -L "$QUIXDEVS_WP_ROOT/wp-content/plugins/quixdevs-stripe-rest-payments"
          rm "$QUIXDEVS_WP_ROOT/wp-content/plugins/quixdevs-stripe-rest-payments"
          wp plugin install dist/quixdevs-stripe-rest-payments.zip --activate --path="$QUIXDEVS_WP_ROOT"
      - name: Verify installed package and missing-dependency behavior
        run: |
          wp eval-file tools/installation-smoke.php --path="$QUIXDEVS_WP_ROOT"
          QUIXDEVS_EXPECT_MISSING_DEPENDENCY=1 wp eval-file tools/installation-smoke.php --skip-plugins=woocommerce --path="$QUIXDEVS_WP_ROOT"
          QUIXDEVS_EXPECT_MISSING_DEPENDENCY=1 wp eval-file tools/installation-smoke.php --skip-plugins=woocommerce-gateway-stripe --path="$QUIXDEVS_WP_ROOT"
      - name: Plugin Check on the absolute installed-package path
        run: |
          wp plugin check "$QUIXDEVS_WP_ROOT/wp-content/plugins/quixdevs-stripe-rest-payments" --path="$QUIXDEVS_WP_ROOT" --require="$QUIXDEVS_WP_ROOT/wp-content/plugins/plugin-check/cli.php" --format=strict-json > plugin-check.json
          python3 tools/verify-plugin-check.py plugin-check.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: plugin-check-results
          path: plugin-check.json
